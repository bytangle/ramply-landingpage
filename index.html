<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Ramply - Seamless Crypto to Local Fiat Exchange | Buy & Sell Crypto Instantly</title>
    <meta name="description" content="Convert crypto to local fiat currency instantly with Ramply. Secure API-first platform for seamless cryptocurrency exchange. Join our waitlist today." />
    <meta name="keywords" content="crypto exchange, cryptocurrency, local fiat, crypto API, buy crypto, sell crypto, stablecoins, ramply" />
    <meta name="author" content="Ramply" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ramply.xyz" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Ramply - Seamless Crypto to Local Fiat Exchange" />
    <meta property="og:description" content="Convert crypto to local fiat currency instantly with Ramply. Secure API-first platform for seamless cryptocurrency exchange." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ramply.xyz" />
    <meta property="og:site_name" content="Ramply" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ramply - Seamless Crypto to Local Fiat Exchange" />
    <meta name="twitter:description" content="Convert crypto to local fiat currency instantly with Ramply. Secure API-first platform for seamless cryptocurrency exchange." />
    <meta name="twitter:site" content="@ramply_xyz" />
    <meta name="twitter:creator" content="@ramply_xyz" />

    <!-- Technical Meta Tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#000000" />
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Ramply",
      "url": "https://ramply.xyz",
      "logo": "https://ramply.xyz/logo.png",
      "description": "Seamless crypto to local fiat exchange platform with API-first approach for instant cryptocurrency conversions.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "support@ramply.xyz"
      },
      "sameAs": [
        "https://twitter.com/ramply_xyz",
        "https://linkedin.com/company/ramply-xyz"
      ],
      "offers": {
        "@type": "Offer",
        "description": "Cryptocurrency exchange services with instant local fiat conversion",
        "category": "Financial Services"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Ramply",
      "url": "https://ramply.xyz",
      "description": "The seamless crypto ramp for instant conversion between cryptocurrency and local fiat currency.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://ramply.xyz/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "Crypto to Fiat Exchange",
      "provider": {
        "@type": "Organization",
        "name": "Ramply"
      },
      "description": "Instant conversion service between cryptocurrencies and local fiat currencies with enterprise-grade security.",
      "serviceType": "Financial Technology",
      "areaServed": "Worldwide",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Crypto Exchange Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "RESTful API Access",
              "description": "Clean APIs with comprehensive SDKs for developers"
            }
          },
          {
            "@type": "Offer", 
            "itemOffered": {
              "@type": "Service",
              "name": "Real-time Updates",
              "description": "Instant transaction notifications and updates"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service", 
              "name": "Enterprise Security",
              "description": "Bank-grade protection for all transactions"
            }
          }
        ]
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
